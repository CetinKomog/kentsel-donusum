name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketler
        run: npm install --no-audit --no-fund
      - name: Oyunu uygulamaya kopyala
        run: node scripts/build-www.js
      - name: Android projesi
        run: npx cap add android
      - name: Ikon ve acilis ekrani
        run: npm run assets
        continue-on-error: true
      - name: AdMob uygulama ID
        run: sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4861191491090667~9687183010"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
      - name: Senkronize et
        run: npx cap sync android
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kentsel-donusum-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
