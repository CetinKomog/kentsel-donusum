<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kentsel Dönüşüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3a7bd5;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Baloo 2",system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#share{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,14,40,.72);z-index:10;touch-action:auto}
.sh-card{width:min(92vw,380px);max-height:94vh;overflow:auto;background:#fff;border-radius:26px;padding:16px;box-sizing:border-box;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sh-card img{width:100%;border-radius:16px;display:block;-webkit-touch-callout:default;user-select:auto}
.sh-btns{display:flex;gap:8px;margin-top:12px}
.sh-b{flex:1;border:0;border-radius:16px;padding:12px 8px;font:800 15px "Baloo 2",system-ui,sans-serif;color:#fff;background:linear-gradient(#7b8cff,#4361ee);text-decoration:none;cursor:pointer}
.sh-b.wa{background:linear-gradient(#3ee27d,#128c4a)}
.sh-hint{margin:10px 4px 6px;color:#7a839e;font:600 13px "Baloo 2",system-ui,sans-serif}
.sh-x{border:0;background:#eef0f6;color:#5a6380;border-radius:14px;padding:9px 22px;font:800 14px "Baloo 2",system-ui,sans-serif;cursor:pointer}
</style>

const recentLines=[];
function useLine(l){const i=recentLines.indexOf(l);if(i>=0)recentLines.splice(i,1);recentLines.push(l);if(recentLines.length>20)recentLines.shift();return l;}
function pickLine(pool){let c=pool.filter(l=>!recentLines.includes(l));if(!c.length){let best=pool[0],bi=1e9;for(const l of pool){const i=recentLines.indexOf(l);if(i<bi){bi=i;best=l;}}return useLine(best);}return useLine(rnd(c));}

let AC=null,master,musicGain,sfxGain,noiseBuf,muted=store.get('kd_mute',false),musicOn=false,nextNote=0,mstep=0;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=.5;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!musicOn){musicOn=true;nextNote=AC.currentTime+.1;setInterval(scheduler,25);}
}
function duck(on){if(musicGain&&AC)musicGain.gain.setTargetAtTime(on?.12:.5,AC.currentTime,.1);}
function tone(f,d,type='sine',vol=.2,slide=0,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+d+.02);}
function noise(d,type,freq,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t);s.stop(t+d+.02);}

function sPerfect(c){if(!AC)return;tone(90,.15,'sine',.25,-30);const k=Math.max(0,Math.min(c,10)-1),semi=PENT[k%5]+12*Math.floor(k/5),f=523.25*Math.pow(2,semi/12),t0=AC.currentTime;
  [[f,.15],[f*2,.045],[f*3.01,.015]].forEach(([fr,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.006);g.gain.exponentialRampToValueAtTime(.0005,t0+.5);o.connect(g);g.connect(sfxGain);o.start(t0);o.stop(t0+.55);});}

function ropePt(u){const hang=showHang(),p=hangPos(),hx=hang?p.x:W/2,hy=hang?p.y-16:CRANE_Y+26;return{x:W/2+(hx-W/2)*u,y:CRANE_Y+7+(hy-CRANE_Y-7)*u};}
function spawnBirds(){birds=[.28,.5,.72].map((u,i)=>({u,st:'in',x:i%2?W+30:-30,y:CRANE_Y+60+Math.random()*140,vx:0,vy:0,c:rnd(['#6c757d','#8d99ae','#5c677d']),ph:Math.random()*6,delay:i*.45,face:i%2?-1:1}));}
function updateBirds(dt){
  for(const b of birds){
    if(b.st==='in'){if(b.delay>0){b.delay-=dt;continue;}const r=ropePt(b.u),dx=r.x-b.x,dy=r.y-7-b.y,d=Math.hypot(dx,dy),sp=300*dt;b.face=dx>=0?1:-1;
      if(d<sp){b.st='sit';b.x=r.x;b.y=r.y-7;tone(3200,.06,'sine',.05,600);}else{b.x+=dx/d*sp;b.y+=dy/d*sp+Math.sin(t*9+b.ph)*.9;}}
    else if(b.st==='sit'){const r=ropePt(b.u);b.x=r.x;b.y=r.y-7;}
    else{b.x+=b.vx*dt;b.y+=b.vy*dt;b.face=b.vx>=0?1:-1;}}
  birds=birds.filter(b=>b.st!=='out'||(b.x>-80&&b.x<W+80&&b.y>-80));
}
function drawBirds(){for(const b of birds){if(b.st==='in'&&b.delay>0)continue;const fly=b.st!=='sit',fl=Math.sin(t*26+b.ph);
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(1.35*b.face,1.35);
  if(!fly){ctx.strokeStyle='#e09f3e';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-1.5,4);ctx.lineTo(-1.5,7);ctx.moveTo(1.5,4);ctx.lineTo(1.5,7);ctx.stroke();}
  ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(0,0,7.5,5,fly?0:-.15,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-6,-1);ctx.lineTo(-12,-3);ctx.lineTo(-11,2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e9ecef';ctx.beginPath();ctx.ellipse(1,2,4.5,2.6,0,0,7);ctx.fill();
  ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(6,-3.5,3.6,0,7);ctx.fill();
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.moveTo(9,-4);ctx.lineTo(12.5,-3);ctx.lineTo(9,-2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(7.2,-4.3,.9,0,7);ctx.fill();
  ctx.fillStyle=shade(b.c,-.25);
  if(fly){ctx.beginPath();ctx.moveTo(-3,-1);ctx.lineTo(1,-1);ctx.lineTo(-2,-1-11*fl);ctx.closePath();ctx.fill();}
  else{ctx.beginPath();ctx.ellipse(-1.5,-.5,5,3,-.2,0,7);ctx.fill();}
  ctx.restore();}}

function update(dt){
  t+=dt;

    swayT+=dt*1.7;const n=floors.length;

    danger=n>2?Math.min(1,Math.abs(lean)/(FW*.45)):0;
    if(danger>=1){collapse(leanSign);return;}
    if(danger>.6){jumpT-=dt;

      if(jumpT<=0){spawnJumper();jumpT=.9+Math.random()*.9;}}
    else if(danger<.5)warned=false;
    if(ev){ev.t-=dt;ev.d.upd&&ev.d.upd.call(ev.d,dt);if(ev.t<=0)endEvent();}
    if(freezeT>0&&freezeT<90)freezeT-=dt;

    if(winT>0){winT-=dt;if(winT<=0)finishLevel();}

    else{falling.vy+=G0*gMul*dt;falling.x+=falling.vx*dt;falling.y+=falling.vy*dt;if(falling.y+FH>=-n*FH){falling.y=-n*FH-FH;land();}}

      removeTop(Math.min(2,floors.length-1));score=Math.max(0,score-20);shake=20;sBoom();vib([150,50,150]);popup('KABOOM! -2 kat',wy+FH-40,'#e63946',34,1.4);}}
    if(shackPending){shackPending.t-=dt;if(shackPending.t<=0){shackPending=null;if(scene==='play'&&floors.length>1&&floors[floors.length-1].b.type==='shack'){removeTop(1);dust(W/2,-floors.length*FH);sStamp();}}}
    if(thief){thief.k+=dt;}
    if(gull){gull.x+=gull.dir*420*dt;const p=hangPos();if(!gull.hit&&gull.x>p.x-10){gull.hit=1;ampBoost=.45;hangT+=.4;sChirp();shake=6;popup('Martı çarptı!',camY+p.y-20,'#219ebc',22,1);}}
    if(ufo&&ufo.mode==='crash'){ufo.x+=520*dt;const tx=n?floorX(n-1):W/2;if(!ufo.hit&&ufo.x>tx-FW*.3){ufo.hit=1;swayAmp+=FW*.2;shake=22;sBoom();burst(tx,-n*FH+FH*.5,40,['#38b000','#ccff33','#fff','#ffd23f'],500);}}
    complainT-=dt;
    if(n>3&&danger<.6&&swayAmp>FW*.1&&complainT<=0){complain(LINES_SWAY);complainT=2.2+Math.random()*2;}
  }else{hangT+=dt;swayT+=dt*1.7;danger*=Math.pow(.05,dt);overT+=dt;}
  if(scene!=='play'&&scene!=='over'&&scene!=='win'){if(floors.length&&scene!=='play'){}}
  const topY=-floors.length*FH,tc=Math.min(-H*.85,topY-H*.6);
  camY+=(tc-camY)*Math.min(1,dt*3);
  skyF+=((scene==='play'||scene==='over'||scene==='win'?floors.length:0)-skyF)*Math.min(1,dt*.8);
  blackout=ev&&ev.id==='elektrik'?blackout:Math.max(0,blackout-dt*2);
  for(const f of floors)if(f.land>0)f.land=Math.max(0,f.land-dt*3.2);
  for(const d of debris){if(d.slide>0){d.slide-=dt;d.x+=d.vx*dt;if(d.slide<=0){d.crashed=true;const wy=d.y;for(let i=0;i<30;i++)parts.push({x:d.x+(Math.random()-.5)*FW,y:wy+FH*Math.random(),vx:Math.sign(d.vx)*Math.random()*300+(Math.random()-.5)*200,vy:-Math.random()*300,life:1,max:1,c:rnd(['#bde0fe','#a2d2ff','#e0fbfc','#fff']),sz:4+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*20,type:'sq',g:1400});sGlass();shake=10;if(scene==='play')loseLife('CAM KIRILDI!','Cam kat kaydı, tuzla buz oldu!');}continue;}

  debris=debris.filter(d=>!d.crashed&&d.y<camY+H+400&&d.y>camY-H*1.5);
  updateBirds(dt);
  for(const j of jumpers){j.vy+=G0*.55*dt;j.x+=j.vx*dt;j.y+=j.vy*dt;j.rot+=j.vr*dt;j.life-=dt;}
  jumpers=jumpers.filter(j=>j.y<camY+H+150&&j.y<40);
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=(p.vr||0)*dt;p.life-=dt;if(p.type==='puff'){p.vx*=.92;p.sz+=dt*22;}}
  parts=parts.filter(p=>p.life>0);if(parts.length>500)parts.splice(0,parts.length-500);

  if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
  shake*=Math.pow(.002,dt);glow=Math.max(0,glow-dt*.5);scorePop=Math.max(0,scorePop-dt*4);
}

function rr(x,y,w,h,r){rrc(ctx,x,y,w,h,r);}
function rrc(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function quad(g,a,b,c,d){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();}
function hex2(c){if(c[0]==='#')return c;const m=c.match(/\d+/g);return'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('');}
function shade(hex,p){hex=hex2(hex);const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(p>0){r+=(255-r)*p;g+=(255-g)*p;b+=(255-b)*p}else{r*=1+p;g*=1+p;b*=1+p}return`rgb(${r|0},${g|0},${b|0})`;}
function lerpC(a,b,k){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=(pa>>16)+((pb>>16)-(pa>>16))*k,g=(pa>>8&255)+((pb>>8&255)-(pa>>8&255))*k,bl=(pa&255)+((pb&255)-(pa&255))*k;return`rgb(${r|0},${g|0},${bl|0})`;}
function wrap(text,maxW){const ws=text.split(' '),out=[];let line='';for(const w of ws){const tt=line?line+' '+w:w;if(ctx.measureText(tt).width>maxW&&line){out.push(line);line=w;}else line=tt;}if(line)out.push(line);return out;}

function paintSide(g,w,h,b){
  const d=D(),dy=DY(),P=(u,v)=>[w+u*d,v*h-u*dy];
  quad(g,P(0,0),P(1,0),P(1,1),P(0,1));
  const gr=g.createLinearGradient(w,0,w+d,0);gr.addColorStop(0,shade(b.color,-.2));gr.addColorStop(1,shade(b.color,-.3));g.fillStyle=gr;g.fill();
  if(b.type!=='shop'){quad(g,P(.24,.17),P(.76,.17),P(.76,.64),P(.24,.64));g.fillStyle='#d9d6d0';g.fill();
    quad(g,P(.32,.21),P(.68,.21),P(.68,.6),P(.32,.6));const sg=g.createLinearGradient(w,h*.2,w,h*.6);
    if(b.wins[0].lit){sg.addColorStop(0,'#f7d98b');sg.addColorStop(1,'#d9a441');}else{sg.addColorStop(0,'#6f9fcc');sg.addColorStop(1,'#34587f');}g.fillStyle=sg;g.fill();}
  quad(g,P(0,.89),P(1,.89),P(1,1),P(0,1));g.fillStyle='#bdb6aa';g.fill();
  quad(g,P(0,0),P(1,0),P(1,.12),P(0,.12));g.fillStyle='rgba(0,0,0,.12)';g.fill();
  g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1;g.beginPath();g.moveTo(w+.5,0);g.lineTo(w+.5,h);g.stroke();
}

function paintFloor(g,w,h,b){

  let gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,shade(base,.16));gr.addColorStop(1,shade(base,-.02));g.fillStyle=gr;g.fillRect(0,0,w,h);

    if(b.type==='B')paintBalcony(g,w,h,b);

      let sg=g.createLinearGradient(0,ay+ah,0,ay+ah+7);sg.addColorStop(0,'rgba(30,20,10,.25)');sg.addColorStop(1,'rgba(30,20,10,0)');g.fillStyle=sg;g.fillRect(ax,ay+ah,aw+2,7);
      sg=g.createLinearGradient(0,ay,0,ay+ah);sg.addColorStop(0,'#fdfdfc');sg.addColorStop(1,'#d9dcdf');g.fillStyle=sg;rrc(g,ax,ay,aw,ah,2);g.fill();
      g.strokeStyle='#9aa1a9';g.lineWidth=1;g.beginPath();g.arc(ax+aw*.62,ay+ah/2,ah*.34,0,7);g.stroke();g.beginPath();g.moveTo(ax+aw*.62-ah*.34,ay+ah/2);g.lineTo(ax+aw*.62+ah*.34,ay+ah/2);g.moveTo(ax+aw*.62,ay+ah/2-ah*.34);g.lineTo(ax+aw*.62,ay+ah/2+ah*.34);g.stroke();
      for(let i=0;i<3;i++){g.beginPath();g.moveTo(ax+3,ay+ah*(.3+i*.2));g.lineTo(ax+aw*.3,ay+ah*(.3+i*.2));g.stroke();}
      g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.3;g.beginPath();g.moveTo(ax+aw*.2,ay+ah);g.lineTo(ax+aw*.2,h*.88);g.stroke();}
  }

  const sb=h*.11;gr=g.createLinearGradient(0,h-sb,0,h);gr.addColorStop(0,'#f4efe7');gr.addColorStop(1,'#dcd5ca');g.fillStyle=gr;g.fillRect(0,h-sb,w,sb);
  g.fillStyle='rgba(255,255,255,.7)';g.fillRect(0,h-sb,w,1);

    g.fillStyle='#fff6c9';g.font=`800 ${Math.round(h*.16)}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('★',w*.5,h*.9);}

const SM=6;

function drawFloor(cx,ty,b,rot=0,sq=0){

  const list=floors.slice(-Math.min(floors.length,9)),sc=Math.min(440/FW,560/(FH*Math.max(list.length,1))),base=1128;
  let y=base;const offs=list.map(fl=>fl.off-(list[0]?list[0].off:0));
  list.forEach((fl,i)=>{const fw=FW*sc,fh=FH*sc,x=540-fw/2+offs[i]*sc*.6;y-=fh;const sp=sprite(fl.b);
    g.drawImage(sp,x-SM*sc,y-(SM+DY()+10)*sc,(FW+D()+2*SM)*sc,(FH+DY()+10+2*SM)*sc);if(i===list.length-1){g.fillStyle='#d9603b';g.beginPath();g.moveTo(x-10,y);g.lineTo(x+fw*.14,y-fh*.34);g.lineTo(x+fw*.86,y-fh*.34);g.lineTo(x+fw+10,y);g.fill();}});
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  const T=(s,x,y2,size,fill,stroke)=>{g.font=`800 ${size}px ${FONT}`;if(stroke){g.lineWidth=size*.14;g.strokeStyle=stroke;g.strokeText(s,x,y2);}g.fillStyle=fill;g.fillText(s,x,y2);};
  g.fillStyle='rgba(255,255,255,.92)';rrc(g,70,60,940,250,48);g.fill();
  T('KENTSEL DÖNÜŞÜM',540,120,64,'#ff7b2e','#a8400f');
  T(peak+' KATLI BİNA',540,205,78,'#1d3557');
  g.font=`700 34px ${FONT}`;g.fillStyle='#7a839e';g.fillText(score+' puan • '+(run.mode==='city'?CITIES[run.c].name+' / '+CITIES[run.c].hoods[run.h]:'Sonsuz Mod'),540,268);
  g.fillStyle='rgba(10,20,50,.72)';rrc(g,90,1180,900,130,36);g.fill();
  T('Sen kaç kat dikebilirsin?',540,1228,46,'#fff');g.font=`600 24px ${FONT}`;g.fillStyle='rgba(255,255,255,.75)';g.fillText(SHARE_URL.replace('https://',''),540,1280);
  shareCv=c;return c.toDataURL('image/png');
}
function openShare(){
  let url='';try{url=makeShareCard();}catch(e){}
  const text=`Kentsel Dönüşüm'de ${peak} katlı bina diktim, sen kaç yaparsın? 🏗️ ${SHARE_URL}`;
  let el=document.getElementById('share');if(!el){el=document.createElement('div');el.id='share';document.body.appendChild(el);}
  el.innerHTML=`<div class="sh-card">${url?`<img src="${url}" alt="Skor kartı">`:''}<div class="sh-btns"><a class="sh-b wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a><button class="sh-b cp">Metni kopyala</button>${navigator.share?'<button class="sh-b ot">Diğer</button>':''}</div><p class="sh-hint">Instagram için: görsele basılı tut → Kaydet → hikâyende paylaş</p><button class="sh-x">Kapat</button></div>`;
  el.style.display='flex';
  el.querySelector('.cp').onclick=async e=>{try{await navigator.clipboard.writeText(text);e.target.textContent='Kopyalandı ✓';}catch(_){e.target.textContent='Kopyalanamadı';}};
  const ot=el.querySelector('.ot');if(ot)ot.onclick=()=>{try{if(shareCv&&shareCv.toBlob)shareCv.toBlob(async blob=>{try{const file=new File([blob],'kentsel-donusum.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text});else await navigator.share({text});}catch(_){}});else navigator.share({text}).catch(()=>{});}catch(_){}};
  el.querySelector('.sh-x').onclick=()=>{el.style.display='none';};
}

/* ================= ANA ÇİZİM ================= */
function render(){
  UIB=[];
  if(scene==='hood'){drawHood();if(modal&&modal.type==='level')drawLevelCard();drawMuteOnly();return;}
  renderWorld();
  if(scene==='home')drawHome();
  else if(scene==='cities')drawCities();
  else if(scene==='over')drawOver();
  else if(scene==='win')drawWin();
  const keep=UIB;drawHUD();
  if(scene==='play'&&modal==='pause')drawPause();
}
function drawMuteOnly(){if(!modal)iconBtn(W-50,14,38,icoMute,toggleMute);}

/* ================= GİRİŞ & DÖNGÜ ================= */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();
  const x=e.clientX,y=e.clientY;
  for(let i=UIB.length-1;i>=0;i--){const b=UIB[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sPop();b.fn();return;}}
  if(scene!=='play'||paused||modal)return;
  if(thief&&thief.sx!=null&&Math.hypot(x-thief.sx,y-thief.sy)<46){thief.hits++;tone(500+thief.hits*150,.08,'square',.08);shake=5;burst(thief.sx,thief.sy+camY,6,['#fff','#ffd23f'],200);
    if(thief.hits>=3){const k=thief.keko;addScore(30,thief.sy+camY-40);popup(k?'Keko kovuldu!':'Hırsız yakalandı!',thief.sy+camY-40,k?'#f77f00':'#3c096c',24,1.3);jumpers.push({x:thief.sx,y:thief.sy+camY,vx:-80,vy:-200,rot:0,vr:4,text:k?pickLine(KEKO_CAUGHT):'Tamam abi tamam!',life:1.6,shirt:k?'#1d1d1d':'#222',teyze:false});sGold();thief=null;endEvent();}return;}
  if(stamp&&stamp.sx!=null&&Math.hypot(x-stamp.sx,y-stamp.sy)<74){stamp.hits++;sStamp();shake=6;vib(20);if(stamp.hits>=3){popup('Onaylandı!',camY+H*.4,'#2a9d8f',30,1.2);endEvent();}return;}
  if(winT>0)return;
  if(!falling&&nextIn<=0)drop();
});
nextBlock();
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

</script>
