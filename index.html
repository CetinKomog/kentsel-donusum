  if(kacak.ask){UIB=[];dim(.55);const pw=Math.min(W*.88,340),cx=W/2,cy=H*.5;card(cx,cy,pw,300);txt('BİNA HAZIR! 🏢',cx,cy-112,24,{fill:'#2b3150',shadow:0});
    ctx.font=`700 14px ${FONT}`;wrap('Teslim edebilirsin… ya da kaçak kat çıkarsın. Her kaçak kat kazancı ikiye katlar ama zabıta basarsa katlar yıkılır, kazancın yarısı gider!',pw-50).forEach((l,i)=>txt(l,cx,cy-72+i*19,14,{fill:'#5c6584',weight:700,shadow:0}));
    button('🏁 TESLİM ET',cx,cy+50,pw*.78,48,'#2ee6a8','#0aa36f',()=>{kacak.ask=false;kacakDeliver();},16);
    button('😈 KAÇAK KAT ÇIK',cx,cy+108,pw*.78,48,'#ff6b6b','#c1121f',()=>{kacak.ask=false;kacak.active=true;nextBlock();showBanner('KAÇAK KAT!','Zabıta gelmeden çık, sonra teslim et','#c1121f',1.8);},16);return;}
  if(kacak.active){const bw=150,bx=W-bw-12,by=H-150;button('🏁 TESLİM ET',bx+bw/2,by,bw,40,'#2ee6a8','#0aa36f',()=>kacakDeliver(),13);
    const r=kacak.risk||.14;ctx.fillStyle='rgba(16,22,48,.8)';rr(12,by-20,150,40,14);ctx.fill();txt('🚨 Zabıta riski %'+Math.round(r*100),87,by-6,11,{shadow:0});txt('Kaçak: '+kacak.k+' kat • +'+kacak.coins+'💰',87,by+9,10,{fill:'#ffd166',weight:700,shadow:0});}}
/* ================= MEYDAN OKUMA KODU ================= */
const CH_AL='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function chEncode(mode,c,h,p,sc){let v=(Math.min(sc,262143)&262143);v=v*32+(c&31);v=v*4+(h&3);v=v*4+(p&3);v=v*2+(mode==='endless'?1:0);let s='';for(let i=0;i<6;i++){s=CH_AL[v%32]+s;v=Math.floor(v/32);}let cs=0;for(const ch of s)cs=(cs*7+CH_AL.indexOf(ch))%32;return s+CH_AL[cs];}
function chDecode(code){code=(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');if(code.length!==7)return null;const s=code.slice(0,6);let cs=0;for(const ch of s){const i=CH_AL.indexOf(ch);if(i<0)return null;cs=(cs*7+i)%32;}if(CH_AL[cs]!==code[6])return null;
  let v=0;for(const ch of s)v=v*32+CH_AL.indexOf(ch);const e=v%2;v=Math.floor(v/2);const p=v%4;v=Math.floor(v/4);const h=v%4;v=Math.floor(v/4);const c=v%32;v=Math.floor(v/32);if(c>=CITIES.length||h>2||p>3)return null;return{mode:e?'endless':'city',c,h,p,score:v};}
let challenge=null;
function startChallenge(ch){challenge=ch;if(ch.mode==='endless')startRun(ENDLESS?Object.assign({},ENDLESS):{mode:'endless'});else startRun(levelCfgT(ch.c,ch.h,ch.p));showBanner('⚔️ MEYDAN OKUMA','Hedef: '+ch.score+' puanı geç!','#7b2cbf',2.4);}
function chResultLine(){if(!challenge)return null;const ok=score>challenge.score;if(ok){stBump('meydan');checkAch();}return ok?'⚔️ Meydan okumayı KAZANDIN! ('+challenge.score+' geçildi)':'⚔️ Kaybettin… hedef '+challenge.score+' puandı';}
function myChallengeCode(){return chEncode(run.mode==='endless'?'endless':'city',run.c|0,run.h|0,run.p|0,score);}
function openChallengeInput(){let el=document.getElementById('chbox');if(!el){el=document.createElement('div');el.id='chbox';el.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,40,.72);z-index:11;touch-action:auto';
    el.innerHTML='<div class="sh-card"><div style="font:800 22px \'Baloo 2\',system-ui;color:#2b3150">⚔️ Meydan Okuma</div><div class="sh-hint">Arkadaşının gönderdiği 7 haneli kodu yaz</div><input id="chin" maxlength="9" autocomplete="off" style="width:100%;box-sizing:border-box;font:800 26px \'Baloo 2\',system-ui;text-align:center;letter-spacing:4px;padding:10px;border:2px solid #dfe3ee;border-radius:14px;text-transform:uppercase"><div id="cherr" style="color:#e63946;font:700 13px system-ui;min-height:18px;margin-top:6px"></div><div class="sh-btns"><button class="sh-b" id="chgo">OYNA</button><button class="sh-b" style="background:linear-gradient(#c9cfdd,#8f97ab)" id="chx">Kapat</button></div></div>';i18nDom(el);
    document.body.appendChild(el);el.querySelector('#chx').onclick=()=>{el.style.display='none';};
    el.querySelector('#chgo').onclick=()=>{const ch=chDecode(el.querySelector('#chin').value);if(!ch){el.querySelector('#cherr').textContent=L('Kod hatalı, tekrar kontrol et');return;}el.style.display='none';audio();startChallenge(ch);};}
  el.style.display='flex';el.querySelector('#cherr').textContent='';el.querySelector('#chin').value='';setTimeout(()=>{try{el.querySelector('#chin').focus();}catch(e){}},50);}
function shareChallenge(){const code=myChallengeCode(),where=run.mode==='endless'?'Sonsuz Mod':CITIES[run.c].name+' / '+CITIES[run.c].hoods[run.h]+' '+(run.p+1)+'. arsa';
  const text=LANG==='en'?'I scored '+score+' points on '+(run.mode==='endless'?'Endless Mode':CITIES[run.c].name+' / '+CITIES[run.c].hoods[run.h]+' lot '+(run.p+1))+' in Urban Renewal! Can you beat it? 😏\nChallenge code: '+code+'\n(Main menu → ⚔️ Challenge)\n'+SHARE_URL:'Kentsel Dönüşüm\'de '+where+' bölümünde '+score+' puan yaptım! Geçebilir misin? 😏\nMeydan okuma kodu: '+code+'\n(Ana menü → ⚔️ Meydan Okuma)\n'+SHARE_URL;
  try{if(navigator.share){navigator.share({text}).catch(()=>{});return;}}catch(e){}try{navigator.clipboard.writeText(text);showBanner('KOD KOPYALANDI','Arkadaşına yapıştır: '+code,'#7b2cbf',2.2);}catch(e){showBanner('KODUN: '+code,'Arkadaşına gönder','#7b2cbf',3);}}
/* ================= YIKILIŞ KLİBİ ================= */
let clipRec=[],clipBlob=null,clipCv=null,clipOn=true;
function clipSupported(){return typeof MediaRecorder!=='undefined'&&cv.captureStream;}
function clipStartPair(){if(!clipOn||!clipSupported()||lowFX)return;try{if(!clipCv){clipCv=document.createElement('canvas');clipCv.width=360;clipCv.height=Math.round(360*H/W/2)*2;}
  const mk=()=>{const st=clipCv.captureStream(24),mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';const r=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:1400000}:{videoBitsPerSecond:1400000});r.chunks=[];r.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data);};r.t0=t;r.start(500);return r;};
  clipStop(true);clipRec=[mk()];clipRec.mk=mk;}catch(e){clipOn=false;}}
function clipTick(){if(!clipRec.length||!clipCv)return;if(lowFX||halfFps){clipStop(true);return;}if(frameN%2)return;try{const g=clipCv.getContext('2d');g.drawImage(cv,0,0,clipCv.width,clipCv.height);
  // 3 sn'de bir yeni kayıt başlat, en fazla 2 kayıt tut (son 3-6 sn her zaman elde)
  const last=clipRec[clipRec.length-1];if(t-last.t0>3){clipRec.push(clipRec.mk());if(clipRec.length>2){const old=clipRec.shift();try{old.stop();}catch(e){}}}}catch(e){}}
function clipStop(discard){clipRec.forEach(r=>{try{r.stop();}catch(e){}});if(discard){clipRec=[];}}
function clipFinish(){if(!clipRec.length)return;const r=clipRec[0];clipRec.slice(1).forEach(x=>{try{x.stop();}catch(e){}});clipRec=[];
  setTimeout(()=>{try{r.onstop=()=>{clipBlob=new Blob(r.chunks,{type:r.mimeType||'video/webm'});};r.stop();}catch(e){}},700);}
function shareClip(){if(!clipBlob){showBanner('Klip hazırlanıyor','Bir saniye sonra tekrar dene','#5c677d',1.4);return;}const ext=(clipBlob.type||'').includes('mp4')?'mp4':'webm',f=new File([clipBlob],'kentsel-donusum.'+ext,{type:clipBlob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:L('Binam yıkıldı 😭 Kentsel Dönüşüm')+' '+SHARE_URL}).catch(()=>{});return;}}catch(e){}
  (async()=>{try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:f.name,data:clipBlob});return;}}catch(e){}showBanner('Klip kaydedilemedi','Uygulama sürümünde direkt paylaşılacak','#5c677d',2);})();}

/* ================= ANA ÇİZİM ================= */
let fadeT=0,lastSceneR=null;
function drawStudioLogo(cx,cy,s,a,anim){a=a==null?1:a;anim=anim==null?1:anim;ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.scale(s,s);
  // amblem: yuvarlak köşeli kare, içinde vinç kancasında K bloğu
  const e=Math.min(1,anim*1.4),drop=(1-e)*-26;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
  const bg=ctx.createLinearGradient(0,-60,0,60);bg.addColorStop(0,'#ff8a3d');bg.addColorStop(1,'#e8461f');ctx.fillStyle=bg;rr(-56,-56,112,112,28);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.14)';rr(-56,-56,112,46,28);ctx.fill();
  // vinç kolu
  ctx.fillStyle='#ffd23f';ctx.fillRect(-44,-40,88,9);ctx.strokeStyle='#9a6400';ctx.lineWidth=1.6;for(let x=-44;x<44;x+=11){ctx.beginPath();ctx.moveTo(x,-40);ctx.lineTo(x+5.5,-31);ctx.lineTo(x+11,-40);ctx.stroke();}
  // halat + kanca
  ctx.strokeStyle='#2b2d42';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(0,-20+drop);ctx.stroke();
  // K bloğu
  ctx.save();ctx.translate(0,12+drop);ctx.rotate((1-e)*.12);
  ctx.fillStyle='#fff8ec';ctx.strokeStyle='#5a2a10';ctx.lineWidth=3;rr(-30,-30,60,58,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffd9b0';ctx.fillRect(-27,18,54,7);
  ctx.font=`800 50px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e8461f';ctx.fillText('K',1,2);
  ctx.restore();
  ctx.restore();ctx.globalAlpha=1;}
function drawStudioWordmark(cx,cy,s,a){ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`800 46px ${FONT}`;const g=ctx.createLinearGradient(0,-24,0,24);g.addColorStop(0,'#ffe08a');g.addColorStop(1,'#ff7b2e');ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle='#5a1f05';ctx.strokeText('KOMOG',0,0);ctx.fillStyle=g;ctx.fillText('KOMOG',0,0);
  ctx.font=`700 15px ${FONT}`;ctx.fillStyle='rgba(255,255,255,.85)';const t2='I N T E R A C T I V E';ctx.fillText(t2,0,34);
  ctx.restore();ctx.globalAlpha=1;}

/* --- Komog Interactive açılış --- */
let studio={t:0,dur:1.9,last:0,thud:0};
function drawStudio(){if(!studio)return;const now=performance.now();if(!studio.last)studio.last=now;studio.t+=Math.min(.05,(now-studio.last)/1000);studio.last=now;studio.f=(studio.f||0)+1;if(studio.f>240)studio.t=studio.dur;
  const T=studio.t,D=studio.dur;if(T>=D){studio=null;return;}UIB=[];
  const out=T>D-.35?Math.max(0,(D-T)/.35):1;
  ctx.globalAlpha=out;const bg=ctx.createRadialGradient(W/2,H*.42,20,W/2,H*.5,Math.max(W,H)*.8);bg.addColorStop(0,'#2a2f5c');bg.addColorStop(1,'#14162b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  const sc=Math.min(W,H)/360,an=Math.min(1,T/.55),ease=1-Math.pow(1-an,3);
  if(an>=1&&!studio.thud){studio.thud=1;try{if(AC&&AC.state==='running')sThud();}catch(e){}}
  const bob=an>=1?Math.sin((T-.55)*9)*Math.max(0,1-(T-.55)*2.2)*3:0;
  drawStudioLogo(W/2,H*.4+bob*sc,1.25*sc,out,ease);
  const wa=Math.max(0,Math.min(1,(T-.45)/.35))*out;drawStudioWordmark(W/2,H*.4+122*sc,1.15*sc,wa);}
function render(){
  if(scene!==lastSceneR){if(lastSceneR!==null)fadeT=1;lastSceneR=scene;}
  renderMain();
  if(scene==='play'){drawSafeZone();drawCityFX();drawPerkFX();drawCbTag();drawKacak();if(arrows.length)drawArrows();drawTutorial();drawPwTip();drawCine();}
  if(tour&&((tour.kind==='home'&&scene==='home')||(tour.kind==='hood'&&scene==='hood')))drawTour();else if(tour&&scene!=='home'&&scene!=='hood')tour=null;
  if((scene==='over'||scene==='win')&&curTip)drawTip();
  drawToasts();
  if(fadeT>0){ctx.fillStyle=`rgba(8,12,35,${fadeT*.6})`;ctx.fillRect(0,0,W,H);}
  if(adModal){UIB=[];drawAd();}
  if(studio)drawStudio();
}
function renderMain(){
  UIB=[];
  if(scene==='hood'){drawHood();if(modal&&modal.type==='level')drawLevelCard();else if(modal&&modal.type==='decor')drawDecorCard();else if(modal&&modal.type==='story')drawStoryCard();drawMuteOnly();return;}
  renderWorld();
  drawAtmos();
  if(scene==='home'){drawHome();if(modal==='wheel')drawWheel();else if(modal==='quests')drawQuests();else if(modal==='settings')drawSettings();else if(modal&&modal.type==='story')drawStoryCard();if(onb<3&&!tour&&!modal)startTour('home');}
  else if(scene==='shop')drawShop();
  else if(scene==='album')drawAlbum();
  else if(scene==='cities')drawCities();
  else if(scene==='over')drawOver();
  else if(scene==='win')drawWin();
  const keep=UIB;drawHUD();
  if(scene==='play'&&modal==='pause')drawPause();
}
function drawMuteOnly(){if(!modal)iconBtn(W-50,14,38,icoMute,toggleMute);}

/* ================= GİRİŞ & DÖNGÜ ================= */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(studio){studio.t=Math.max(studio.t,studio.dur-.35);return;}if(adModal)return;if(tourPointer(e.clientX,e.clientY))return;if(cine&&scene==='play'){cine=null;return;}
  const x=e.clientX,y=e.clientY;lastTap={x,y};
  for(let i=UIB.length-1;i>=0;i--){const b=UIB[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sPop();b.fn();return;}}
  if(kacak&&kacak.ask)return;
  if(scene!=='play'||paused||modal)return;
  if((arrows.length||(X.gond&&!X.gond.used))&&arrowTap(x,y))return;
  if(thief&&thief.sx!=null&&Math.hypot(x-thief.sx,y-thief.sy)<46){thief.hits++;tone(500+thief.hits*150,.08,'square',.08);shake=5;burst(thief.sx,thief.sy+camY,6,['#fff','#ffd23f'],200);
    if(thief.hits>=5){track('thief');const k=thief.keko,KD=THIEF_KINDS[thief.kind];addScore(30,thief.sy+camY-40);popup(KD?'Kovuldu!':k?(thief.bebe?'Bebe kovuldu!':'Keko kovuldu!'):'Hırsız yakalandı!',thief.sy+camY-40,k?'#f77f00':'#3c096c',24,1.3);jumpers.push({x:thief.sx,y:thief.sy+camY,vx:-80,vy:-200,rot:0,vr:4,text:KD?pickLine(KD.caught):k?pickLine(thief.bebe?BEBE_CAUGHT:KEKO_CAUGHT):'Tamam abi tamam!',life:1.6,shirt:k?'#1d1d1d':'#222',teyze:false});sGold();thief=null;endEvent();}return;}
  if(stamp&&stamp.sx!=null&&Math.hypot(x-stamp.sx,y-stamp.sy)<74){stamp.hits++;sStamp();shake=6;vib(20);if(stamp.hits>=5){popup('Onaylandı!',camY+H*.4,'#2a9d8f',30,1.2);endEvent();}return;}
  if(winT>0)return;
  if(!falling&&nextIn<=0)drop();
});
nextBlock();
if(!onb){modal={type:'story',intro:true,c:0,h:0};overT=0;}
let last=performance.now();
let slowT=0;
function loop(now){const raw=(now-last)/1000,dt=Math.min(.033,raw);last=now;
  if(raw>.028&&raw<.5)slowT+=raw;else slowT=Math.max(0,slowT-raw*.5);
  if(slowT>3){slowT=0;if(!halfFps)halfFps=true;else if(maxDPR>2&&scene!=='play'){maxDPR=Math.max(2,Math.min(maxDPR,window.devicePixelRatio||1)-.5);resize();}else if(!lowFX)lowFX=true;}
  requestAnimationFrame(loop);
  try{update(dt);}catch(e){errN=(errN||0)+1;if(errN<5)console.error(e);}frameN++;try{if(scene==='play'||!halfFps||frameN%2===0)render();}catch(e){errN=(errN||0)+1;if(errN<5)console.error(e);try{ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;}catch(_){}}try{if(scene==='play')clipTick();}catch(e){}}
let errN=0;
let frameN=0;
requestAnimationFrame(loop);

</script>
